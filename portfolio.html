  <style>

    body {

    .project-description {

      color: #444;

    .project-images {
      display:  grid;
      grid-template-columns: repeat (auto-fi11, minmax(280px, 1fr)); 
      gap: 1rem;
    }

    .project-images img {
      width: 80%;
      height: auto;
      border: 1px solid #ddd;
    }

    footer {
      background-color: #000;
      color: #aaa;
      text-align: center;
      padding: 1rem;
      margin-top: 4rem;
    }
  
    @media (max-width: 600px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      nav {
        margin-top: 0.5rem;
      }
      nav a {
        margin-left: 0;
        margin-right: 1rem;
      }
      .project h2 {
        font-size: 1.5rem;
      }
      .project-description {
        font-size: 0.95rem;
      }
    }
